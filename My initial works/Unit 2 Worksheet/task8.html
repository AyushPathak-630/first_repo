<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> table </title>
</head>
<body>
    <table border="2px" cellspacing="0" cellpadding="20px" width="50%" align="center" >
  <caption><h2>Employee Salary</h2></caption>
  <tr>
    <th scope="col">Name</th>
    <th scope="col">Salary</th>
  </tr>
  <tr>
    <td>John</td>
    <td>$2000</td>
  </tr>
</table>

</body>
</html>
