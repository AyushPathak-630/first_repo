<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> table </title>
</head>
 <!-- To explain the purpose of each table element and then use them practically -->
<body>
   <dl>
    <dt> <b>tr</b> </dt>
    <dd> - It represents the Table row </dd>
    <dt><b> th</b> </dt>
    <dd> - It represents the table heads by highlighting them </dd>
    <dt> <b>td</b> </dt>
    <dd> - It represents the table data </dd>
   </dl> 

   <table border="1px">
    <tr>
        <th> Course </th>
        <th> Duration </th>
    </tr>
    <tr>
        <td> HTML </td>
        <td> 3 Weeks </td>
    </tr>
   </table>
</body>
</html>
