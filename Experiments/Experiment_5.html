<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fifth experiment</title>
</head>
<body>
    <!-- student registration form -->

<h1 style="text-align: center";> Student Registration Form </h1>

<hr>
<br>
<form align="center" action="submit.html" method="post">

<label for="name"> Full Name: </label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

<label for="email"> Email: </label>
<input type="email" id="email" name="email" placeholder="Enter valid email address" required><br><br>

<label for="password"> Password: </label>
<input type="password" id="password" name="password" placeholder="Enter password" required><br><br>

<label> Gender: </label>
<input type="radio" name="gender" value="male" required> Male
<input type="radio" name="gender" value="female"> Female <br><br>

<label for="course"> Course: </label>
<select id="course" name="course" required>
    <option value="">-- Select Course --</option>
    <option value="btech">B.Tech</option>
    <option value="bca">BCA</option>
    <option value="mba">MBA</option>
    <option value="mca">MCA</option>
</select><br><br>

<label for="contact"> Contact No: </label>
<input type="tel" id="contact" name="contact" placeholder="Enter phone number"
    required><br><br>

<label for="address"> Address: </label><br>
<textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address" required></textarea><br><br>
<input type="submit" value="Register">
<input type="reset" value="Clear">
</form>
<hr>
<p align="center"> &copy; 2025 Student Registration Portal </p>
</body>
</html>
