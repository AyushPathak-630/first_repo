<!DOCTYPE html>
<html lang="en">
<head>
    <title> Hotel Room Booking </title>
</head>
<body>
    <!-- Hotel Room Booking Form -->

    <h1 style="text-align: center;"> Hotel Room Booking Form </h1>
    <br>
    
    <form style="text-align: center;" action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" name="name" placeholder="Enter your Name here">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter Email here" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="number" name="phone" placeholder="Enter phone number" required>
        <br><br>
        <label for="checkin">Check-in Date:</label>
        <input type="date" name="checkin" required>
        <br><br>
        <label for="checkout">Check-out Date:</label>   
        <input type="date" name="checkout" required>
        <br><br>
        <label for="room">Room Type:</label>
        <select id="room" name="room">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
            <option value="luxury">Luxury Room</option>
        </select>
        <br><br>
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10" required>
        <br><br>
        <label for="requests">Special Requests:</label><br>
        <textarea id="requests" name="requests" rows="4" cols="30" placeholder="Enter any special requests here..."></textarea>
        <br><br>

        <input type="submit" value="Book Now">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
